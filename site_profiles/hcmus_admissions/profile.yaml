id: hcmus_admissions
name: HCMUS Admissions & FAQ
topic: Vietnamese Education
domain_label: education
enabled: true

seed_urls:
  - https://tuyensinh.hcmus.edu.vn/
  - https://tuyensinh.hcmus.edu.vn/cau-hoi-thuong-gap/
  - https://tuyensinh.hcmus.edu.vn/thong-tin-tuyen-sinh-cac-nam/
  - https://tuyensinh.hcmus.edu.vn/chi-tieu/
  - https://tuyensinh.hcmus.edu.vn/phuong-thuc-tuyen-sinh/
  - https://tuyensinh.hcmus.edu.vn/diem-chuan-2/
  - https://tuyensinh.hcmus.edu.vn/hoc-phi/
  - https://tuyensinh.hcmus.edu.vn/nganh-dao-tao/
  - https://tuyensinh.hcmus.edu.vn/nganh-moi/
  - https://tuyensinh.hcmus.edu.vn/hoc-bong/
  - https://tuyensinh.hcmus.edu.vn/thong-tin-nhap-hoc/

allowed_domains:
  - tuyensinh.hcmus.edu.vn

user_agent: "VIRERetrievalCrawler/1.0 (academic research; respectful crawling)"

crawl:
  max_depth: 2
  max_pages: 400
  max_requests: 900
  request_timeout: 20

rate_limit:
  initial_delay: 2.0
  min_delay: 2.0
  max_delay: 120.0
  max_retries: 5
  retry_statuses: [429, 503]
  success_window: 8
  recovery_factor: 0.85

policy:
  robots: respect
  robots_unavailable: block
  stop_host_statuses: [401, 403]
  challenge_patterns:
    - "just a moment"
    - "access denied"
    - "verify you are human"
    - "captcha"
    - "cf-chl-"

url:
  trailing_slash: preserve
  allow_path_regex:
    - '^/$'
    - '^/cau-hoi-thuong-gap/?$'
    - '^/(?:thong-tin-tuyen-sinh-cac-nam|chi-tieu|chi-tieu-2|phuong-thuc-tuyen-sinh|diem-chuan-2|hoc-phi|nganh-dao-tao|nganh-moi|hoc-bong|thong-tin-nhap-hoc)/?$'
    - '^/202[4-6]-[^/]+/?$'
    - '^/(?:nganh|nhom-nganh)-[^/]+/?$'
    - '^/danh-muc/thong-tin-tuyen-sinh/(?:thong-tin-tuyen-sinh-nam-202[4-6]|thong-tin-tuyen-sinh-cac-nam-truoc)/?$'
  deny_path_regex:
    - '^/(?:wp-admin|wp-login|wp-content|wp-json|feed|xmlrpc\.php)(?:/|$)'
  strip_query_prefixes: [utm_]
  strip_query_keys: [ref]
  sort_query: true

page_types:
  - name: root
    url_regex: '^/$'
  - name: faq
    url_regex: '^/cau-hoi-thuong-gap/?$'
  - name: admissions_overview
    url_regex: '^/thong-tin-tuyen-sinh-cac-nam/?$'
  - name: quota
    url_regex: '^/chi-tieu(?:-2)?/?$'
  - name: admission_methods
    url_regex: '^/phuong-thuc-tuyen-sinh/?$'
  - name: cutoff_scores
    url_regex: '^/diem-chuan-2/?$'
  - name: tuition
    url_regex: '^/hoc-phi/?$'
  - name: programs
    url_regex: '^/(?:nganh-dao-tao|nganh-moi|nganh-[^/]+|nhom-nganh-[^/]+)/?$'
  - name: scholarship
    url_regex: '^/hoc-bong/?$'
  - name: enrollment
    url_regex: '^/thong-tin-nhap-hoc/?$'
  - name: education_article
    url_regex: '^/.+'

extract:
  parser: html.parser
  title:
    selectors: ['.entry-title', '#content > div > h1', 'title']
  content:
    container_selectors: ['main', 'article', '.entry-content', '.site-main', 'body']
    remove_selectors: ['script', 'style', 'noscript', 'nav', 'footer', 'header', 'form']
  metadata: []

links:
  default_follow: true
  default_selector: 'a[href]'

preprocess:
  min_words: 55
  min_chars: 280
  min_vietnamese_score: 0.35
  min_relevance_score: 0.20
  min_keyword_hits: 2
  relevance_keywords:
    - tuyển sinh
    - xét tuyển
    - thí sinh
    - sinh viên
    - học phí
    - học bổng
    - ngành
    - chương trình
    - hồ sơ
    - điểm chuẩn
    - nhập học
    - chỉ tiêu
    - phương thức
    - ký túc xá
  required_any_keywords:
    - tuyển sinh
    - xét tuyển
    - thí sinh
    - sinh viên
    - học phí
    - học bổng
    - ngành
    - chương trình
    - hồ sơ
    - điểm chuẩn
    - nhập học
  chunk_words: 200
  chunk_overlap_words: 40
  min_chunk_words: 40
